name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runners ship the Android SDK; add the platform and build tools this build uses.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tags look like v1.2.3, got $TAG" >&2; exit 1
          fi
          # 1.2.3 -> 10203: always grows with the version, so updates install over older builds.
          CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROMSTORE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ROMSTORE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ROMSTORE_KEYSTORE_BASE64 secret: building with a throwaway debug key and NOT publishing (it could not update installed copies). Add the signing secrets, see README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build the release APK
        env:
          ROMSTORE_STORE_PASSWORD: ${{ secrets.ROMSTORE_STORE_PASSWORD }}
          ROMSTORE_KEY_ALIAS: ${{ secrets.ROMSTORE_KEY_ALIAS }}
          ROMSTORE_KEY_PASSWORD: ${{ secrets.ROMSTORE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Check and name the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -3
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.name }}'" || { echo "versionName does not match the tag" >&2; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/ROM-Store-$TAG.apk"
          # A fixed name too, so .../releases/latest/download/ROM-Store.apk always works.
          cp "$APK" dist/ROM-Store.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Keep the unsigned build as an artifact
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Store-${{ env.TAG }}-unsigned
          path: dist/*

      # Only a build signed with the release key is published: anything else
      # would not install over the copies people already have.
      - name: Publish the release
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ROM Store ${{ env.TAG }}
          generate_release_notes: true
          body: |
            Install: download **ROM-Store-${{ env.TAG }}.apk** on your device and open it (allow installing from your browser or file manager when Android asks).
            Always the newest: https://github.com/${{ github.repository }}/releases/latest/download/ROM-Store.apk
          files: |
            dist/ROM-Store-${{ env.TAG }}.apk
            dist/ROM-Store.apk
            dist/SHA256SUMS.txt
